<!DOCTYPE html>
<html lang="en">

<head>

    <title>Elephant Recognition</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f3;
      color: #a2b6d4;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      gap: 15px;
    }

    button {
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    #addFootage {
      background-color: #4caf50;
      color: white;
    }

    #addFootage:hover {
      background-color: #000000;
    }

    #beginRecognition {
      background-color: #2196f3;
      color: white;
    }

    #beginRecognition:hover {
      background-color: #010101;
    }
    #saveData {
        background-color: #82293c;
        color: white;
    }    
    #saveData:hover {
        background-color: #000000;
    }
  </style>
</head>
<body style="background-color:rgb(37, 93, 95);">
<img src="https://cdn-icons-png.flaticon.com/512/3069/3069224.png" alt="Elephant Image" style="margin-top: 100px; width: 100px; height: auto;">
  <h1 id="greeting"></h1>
  <div class="buttons">
    <button id="addFootage">Add/Select Footage</button>
    <button id="beginRecognition">Start/Begin Recognition</button>
    <button id="saveData">Save Data</button>
  </div>

  <script>
    const greeting = document.getElementById('greeting');
    const hour = new Date().getHours();

    if (hour < 12) {
      greeting.textContent = 'Good Morning,';
    } else if (hour < 18) {
      greeting.textContent = 'Good Afternoon,';
    } else {
      greeting.textContent = 'Good Evening,';
    }
  </script>
  
</body>
</html>
