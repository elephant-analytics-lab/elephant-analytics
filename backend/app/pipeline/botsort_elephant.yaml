tracker_type: botsort

# Detection confidence gates
track_high_thresh: 0.40
track_low_thresh: 0.08
new_track_thresh: 0.40

# Keep tracks alive through exits/occlusions
track_buffer: 360
match_thresh: 0.76
fuse_score: true

# Camera motion compensation
gmc_method: sparseOptFlow

# Appearance-aware association (ReID)
with_reid: true
proximity_thresh: 0.30
appearance_thresh: 0.22
model: auto
